name: Robot de noticias — Mesa de Obras por Impuestos

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ["robot/**", ".github/workflows/robot.yml"]

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar noticias de Obras por Impuestos
        run: node robot/actualizar.mjs
      - name: Guardar si hubo cambios
        run: |
          git config user.name "robot-mesa-oxi"
          git config user.email "robot@users.noreply.github.com"
          git add data/noticias.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Robot: noticias $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') (hora Colombia)"
            git pull --rebase || true
            git push
          fi
